name: Daily FEHD data update

on:
  schedule:
    - cron: '0 2 * * *'  # 10:00 HKT
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch FEHD restaurants
        run: python3 scripts/fetch-fehd.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/restaurants.min.json
          git diff --staged --quiet || git commit -m "chore: update FEHD restaurant data $(date -u +%Y-%m-%d)"
          git push
